name: Build Signed IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "导出方式（须与描述文件类型一致）"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - ad-hoc
          - app-store
          - enterprise

env:
  BUNDLE_ID: com.example.ClipboardApp

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          # 从 Secrets 解码证书和描述文件
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          # 创建临时钥匙串并导入证书
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # 安装描述文件
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Read provisioning profile info
        id: profile
        run: |
          set -euo pipefail
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          echo "uuid=$(plutil -extract UUID raw -o - "$RUNNER_TEMP/profile.plist")" >> "$GITHUB_OUTPUT"
          echo "team_id=$(plutil -extract TeamID.0 raw -o - "$RUNNER_TEMP/profile.plist")" >> "$GITHUB_OUTPUT"

      - name: Archive
        env:
          EXPORT_METHOD: ${{ inputs.export_method }}
          PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
          TEAM_ID: ${{ steps.profile.outputs.team_id }}
        run: |
          set -euo pipefail

          if [ "$EXPORT_METHOD" = "development" ]; then
            IDENTITY="Apple Development"
          else
            IDENTITY="Apple Distribution"
          fi

          xcodebuild archive \
            -project ClipboardApp.xcodeproj \
            -scheme ClipboardApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ClipboardApp.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

      - name: Export IPA
        env:
          EXPORT_METHOD: ${{ inputs.export_method }}
          PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
          TEAM_ID: ${{ steps.profile.outputs.team_id }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>$EXPORT_METHOD</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_UUID</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ClipboardApp.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          ls -la "$RUNNER_TEMP/export"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardApp-${{ inputs.export_method }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7
